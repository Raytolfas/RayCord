# RayCord MOTD module.

enabled = true

# MiniMessage lines joined with a newline.
lines = [
  "<gradient:#09add3:#8ae6ff><bold>RayCord</bold></gradient> <gray>- <white>next-gen proxy",
  "<gray>Online:</gray> <aqua>%shown_online%</aqua>/<aqua>%shown_max%</aqua> <dark_gray>|</dark_gray> <yellow>play.example.net</yellow>"
]

# Use -1 to keep the real values.
online = -1
max = -1

# When true, the client will see ??? instead of player counts.
null-players = false

# Text shown in the hover player sample list.
sample-players = [
  "Website: your-network.tld",
  "Discord: discord.gg/yourserver",
  "Players online: %online%"
]
